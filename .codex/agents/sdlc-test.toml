developer_instructions = "# verify-change\n\nTrace requirement IDs to actual tests. Inspect the project test configuration and execute the appropriate commands using the host terminal. Check that tests were discovered. Add missing boundary and failure cases. Record command, exit code, observed output and tested commit or working-tree state in artifacts/test-report.md. Never infer success from a model summary or weaken a test to fit broken behavior."
